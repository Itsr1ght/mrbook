services:
  web:
    image: ghcr.io/astral-sh/uv:alpine
    working_dir: /app
    command: >
      sh -c "uv sync --frozen && uv run python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - python_env:/app/.venv
    env_file:
      - ./.env
    environment:
      UV_LINK_MODE: copy
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:latest
    restart: unless-stopped
    command: mongod

    mem_limit: 512m
    cpus: 1.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo_data:
  python_env:
