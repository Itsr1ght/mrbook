[project]
name = "mrbook"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bilal Jafar", email = "64215645+Itsr1ght@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django==6.1",
]

[tool.uv]
package = false

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.basedpyright]
typeCheckingMode = "basic"
reportUnannotatedClassAttribute = "none"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-stubs>=6.1.0",
    "ruff>=0.16.3",
]
